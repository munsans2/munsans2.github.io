
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#eaf2f9" />
  <title>문산중학교 | 3D 과학실 기자재 안내</title>
  <style>
    @font-face {
      font-family: SeoulNamsan;
      src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_two@1.0/SeoulNamsanM.woff") format("woff");
      font-display: swap;
    }
    :root {
      color-scheme: light;
      --bg: #eaf2f9;
      --ink: #18334b;
      --muted: #63778b;
      --glass: rgba(255, 255, 255, .88);
      --line: rgba(255, 255, 255, .92);
      --edge: #dbe6f1;
      --shadow: 0 16px 45px rgba(31, 61, 89, .11);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: SeoulNamsan, "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(ellipse at 12% 15%, #fff 0, transparent 40%),
                  radial-gradient(ellipse at 88% 70%, #c8e3ff 0, transparent 42%), var(--bg);
      transition: background .25s, color .25s;
    }
    body.dark {
      color-scheme: dark;
      --bg: #111a29;
      --ink: #f3f7ff;
      --muted: #b4c3d4;
      --glass: rgba(31, 44, 63, .92);
      --line: rgba(125, 145, 170, .25);
      --edge: #41516a;
      --shadow: 0 16px 45px rgba(0, 0, 0, .22);
      background: radial-gradient(ellipse at 85% 30%, #233e5e 0, transparent 48%), var(--bg);
    }
    .glass {
      background: var(--glass);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 24px;
    }
    .topbar {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 22px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand { padding: 12px 18px; font-weight: 800; border-radius: 999px; }
    .brand span { color: #377abf; margin-left: 4px; font-size: 12px; }
    .theme-btn {
      border: 1px solid var(--edge);
      color: var(--ink);
      padding: 12px 16px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    .theme-btn:focus-visible, .room:focus-visible {
      outline: 3px solid #60a5fa;
      outline-offset: 3px;
    }
    main {
      max-width: 1050px;
      margin: 0 auto;
      padding: 74px 22px 72px;
    }
    .eyebrow {
      color: #3c86c7;
      font-size: 12px;
      letter-spacing: .16em;
      font-weight: 800;
    }
    h1 {
      font-size: clamp(30px, 5vw, 53px);
      letter-spacing: -.045em;
      line-height: 1.22;
      margin: 13px 0 18px;
    }
    .lead {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.8;
      margin: 0 0 35px;
    }
    .rooms {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }
    .room {
      display: flex;
      min-height: 225px;
      padding: 29px;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: var(--ink);
      transition: transform .2s, box-shadow .2s;
    }
    .room:hover {
      transform: translateY(-5px);
      box-shadow: 0 22px 50px rgba(27, 74, 120, .18);
    }
    .room-icon {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      font-size: 30px;
      border-radius: 19px;
      background: linear-gradient(140deg, #d9edff, #f3f8ff);
    }
    .room:nth-child(2) .room-icon {
      background: linear-gradient(140deg, #d6f4ef, #f2fffb);
    }
    .room:nth-child(3) .room-icon {
      background: linear-gradient(140deg, #e5dfff, #f9f7ff);
    }
    .room:nth-child(4) .room-icon {
      background: linear-gradient(140deg, #ffe9d5, #fff8f1);
    }
    .room h2 {
      font-size: 24px;
      margin: 18px 0 6px;
    }
    .room p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .room-bottom {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px;
    }
