
<!DOCTYPE html>
<html lang="ko">
<head>
 <meta charset="UTF-8">

 <meta name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover">

 <meta name="theme-color" content="#eaf2fa">

 <title>
  과학준비실 · 문산중학교 3D 기자재 안내
 </title>

 <link rel="stylesheet" href="../common/style.css">

 <style>
 #searchPanel {
  position: fixed !important;
  left: auto !important;
  right: 18px !important;
  top: 74px;
  z-index: 100;
  width: 225px;
  max-height: calc(100vh - 155px);
  overflow-y: auto;
 }

 #detail:not([hidden]) {
  position: fixed;
  left: 18px;
  right: auto;
  z-index: 110;
 }

 @media(max-width:700px) {
  #searchPanel {
   left: auto !important;
   right: 8px !important;
   top: 65px;
   width: min(225px,70vw);
   max-height: 43vh;
  }

  #detail:not([hidden]) {
   left: 8px;
   right: auto;
   max-width: 75vw;
  }
 }
 </style>
</head>

<body>

 <header class="topbar">

  <a class="round glass" href="../index.html">
   ← 메인
  </a>

  <div class="brand glass">
   <strong>🗄️ 과학준비실</strong>
   <span>문산중학교 · 3D 공간 안내</span>
   <em>visionOS</em>
  </div>

  <button
   id="theme"
   class="round glass"
   aria-label="주간 야간 전환">
   🌙 야간 모드
  </button>

 </header>

 <section
  id="searchPanel"
  class="glass"
  aria-label="보관장 검색">

  <h2>과학준비실 기자재 찾기</h2>

  <p>
   뷰렛·전압계·실험복·실험키트 검색
  </p>

  <input
   id="search"
   type="search"
   placeholder="기자재 또는 보관장 번호"
   autocomplete="off"
   aria-label="검색어 입력">

  <div
   id="results"
   aria-live="polite">
  </div>

  <small>
   선반 미확인 물품은 위쪽부터 임시 배치
   · 관리번호는 시스템용
  </small>

 </section>

 <section
  id="detail"
  class="glass"
  hidden
  aria-label="선택한 보관장">

  <div class="detail-heading">
   <h2 id="detailTitle"></h2>

   <button
    id="detailClose"
    aria-label="닫기">
    ✕
   </button>
  </div>

  <div id="detailMeta"></div>
  <div id="shelfList"></div>

  <button
   id="doorToggle"
   class="primary">
   보관장 문 열기
  </button>

 </section>

 <div id="hint">
  마우스로 회전 · 휠 확대 · 보관장 클릭하여 문 열기
 </div>

 <nav id="controls" class="glass">

  <button data-view="overview" class="active">
   🏫 전체
  </button>

  <button data-view="left">
   🗄 왼쪽
  </button>

  <button data-view="back">
   🔬 뒤쪽
  </button>

  <button data-view="window">
   🪟 오른쪽
  </button>

  <button data-view="top">
   ⬚ 평면
  </button>

  <button id="reset">
   ↻ 초기화
  </button>

  <button id="fullscreen">
   ⛶ 전체화면
  </button>

 </nav>

 <div id="notice" role="status"></div>

 <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

 <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

 <!-- 기존 과학준비실 배치 -->
 <script src="./layout.js"></script>

 <!-- 준비실 기자재 및 3D 모형 -->
 <script src="./contents.js?v=1"></script>

 <!-- 기존 공통 엔진 -->
 <script src="../common/scene.js"></script>

</body>
</html>
