
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>문산중학교 | 과학실 2</title>

<link rel="stylesheet" href="../common/style.css">

<style>
/* =========================================
   과학실 2 전용 화면
   공통 CSS와 충돌하지 않도록 설정
   ========================================= */

body {
  margin: 0;
  font-family: SeoulNamsan, "Pretendard",
    "Malgun Gothic", sans-serif;
}

/* 상단 메뉴 */

.lab2-header {
  position: fixed;
  top: 18px;
  left: 18px;
  right: 18px;
  z-index: 30;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  pointer-events: none;
}

.lab2-header > * {
  pointer-events: auto;
}

.lab2-panel {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,.94);
  border: 1px solid rgba(210,225,240,.8);
  border-radius: 20px;
  padding: 12px 16px;
  box-shadow: 0 8px 28px rgba(45,80,120,.12);
  backdrop-filter: blur(18px);
}

.lab2-panel button,
.lab2-panel a {
  border: 0;
  border-radius: 12px;
  padding: 9px 12px;
  background: #edf4fa;
  color: #344b65;
  cursor: pointer;
  text-decoration: none;
  font-size: 13px;
  white-space: nowrap;
}

.lab2-panel button.active {
  background: #2878e8;
  color: white;
}

/* =========================================
   오른쪽 사이드바
   ========================================= */

.lab2-sidebar {
  position: fixed;
  top: 110px;
  right: 18px;
  bottom: 20px;
  left: auto;
  width: 300px;
  z-index: 25;
  overflow: hidden;
  padding: 20px;
  display: flex;
  flex-direction: column;
  min-height: 0;
  background: rgba(255,255,255,.95);
  border: 1px solid #dbe5ef;
  border-radius: 22px;
  box-shadow: 0 12px 35px rgba(40,70,110,.12);
  backdrop-filter: blur(18px);
}

.lab2-sidebar h2 {
  margin: 0 0 8px;
  font-size: 21px;
  flex-shrink: 0;
}

.lab2-subtitle {
  font-size: 13px;
  color: #71859a;
  margin: 0 0 14px;
  flex-shrink: 0;
}

/* 검색 영역 */

.lab2-search-area {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
}

.lab2-search-area[hidden] {
  display: none !important;
}

#search {
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 1px solid #ccdbe9;
  border-radius: 12px;
  box-sizing: border-box;
  background: white;
  flex-shrink: 0;
}

#results {
  display: flex;
  flex-direction: column;
  gap: 9px;
  overflow-y: auto;
  overflow-x: hidden;
  min-height: 0;
  flex: 1;
  margin-top: 10px;
  padding-right: 2px;
}

#results button {
  display: block;
  width: 100%;
  min-width: 0;
  flex-shrink: 0;
  padding: 12px;
  margin: 0;
  text-align: left;
  border: 1px solid #d7e3f0;
  border-radius: 12px;
  background: #fff;
  color: #344b65;
  cursor: pointer;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: keep-all;
  line-height: 1.5;
}

#results button:hover {
  background: #eaf4ff;
  border-color: #7cb7fa;
}

#results button strong {
  display: block;
  font-size: 13px;
}

#results button small {
  display: block;
  color: #71859a;
  margin-top: 4px;
  font-size: 11px;
  line-height: 1.55;
}

/* =========================================
   상세정보
   중요: fixed 해제
   ========================================= */

#detail {
  position: relative !important;
  top: auto !important;
  right: auto !important;
  bottom: auto !important;
  left: auto !important;

  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;

  width: 100% !important;
  max-width: none !important;
  max-height: none !important;

  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  box-shadow: none !important;
  background: transparent !important;

  overflow-y: auto !important;
  overflow-x: hidden !important;
  z-index: auto !important;
  backdrop-filter: none !important;
}

#detail[hidden] {
  display: none !important;
}

.lab2-detail-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  flex-shrink: 0;
}

#detailTitle {
  font-size: 17px;
  margin: 0;
  line-height: 1.5;
  overflow-wrap: anywhere;
  word-break: keep-all;
}

#detailClose {
  flex-shrink: 0;
  border: 0;
  padding: 8px 11px;
  border-radius: 10px;
  background: #e9f0f8;
  color: #344b65;
  cursor: pointer;
}

#detailMeta {
  display: block;
  font-size: 12px;
  line-height: 1.7;
  color: #64778c;
  margin: 0 0 12px;
  overflow-wrap: anywhere;
  word-break: keep-all;
  white-space: normal;
}

/* 선반별 목록 */

#shelfList {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0 0 12px;
  min-width: 0;
}

#shelfList button {
  display: block;
  width: 100%;
  height: auto;
  min-height: 40px;
  flex-shrink: 0;
  padding: 10px 12px;
  margin: 0;
  text-align: left;
  border: 1px solid #d3e0ef;
  border-radius: 11px;
  background: #f4f8ff;
  color: #344b65;
  cursor: pointer;
  line-height: 1.6;
  white-space: normal;
  overflow-wrap: anywhere;
  word-break: keep-all;
}

#shelfList button.active {
  background: #d4e9ff;
  border-color: #3699fa;
}

#doorToggle {
  width: 100%;
  flex-shrink: 0;
  margin-top: 12px;
  padding: 12px;
  border: 0;
  border-radius: 12px;
  background: #2878e8;
  color: white;
  font-weight: 700;
  cursor: pointer;
}

#doorToggle:disabled {
  background: #cbd5df;
  cursor: not-allowed;
}

/* 하단 메뉴 */

.lab2-bottom {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 20;
  display: flex;
  gap: 8px;
}

.lab2-bottom button {
  background: rgba(255,255,255,.92);
  border: 1px solid #d8e4ef;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
}

/* 알림 */

#notice {
  display: none;
  position: fixed;
  z-index: 100;
  top: 50%;
  left: 50%;
  bottom: auto;
  transform: translate(-50%,-50%);
  background: white;
  color: #22354a;
  padding: 24px;
  border-radius: 16px;
}

/* 야간 모드 */

body.dark .lab2-panel,
body.dark .lab2-sidebar {
  background: rgba(28,41,59,.96);
  color: #e8f1fb;
  border-color: #42566d;
}

body.dark #results button,
body.dark #shelfList button,
body.dark #search,
body.dark #detailClose {
  background: #334960;
  color: #edf5ff;
  border-color: #4c6279;
}

body.dark #detailMeta,
body.dark .lab2-subtitle {
  color: #b8c8d8;
}

/* 모바일 */

@media (max-width: 700px) {
  .lab2-header {
    top: 8px;
    left: 8px;
    right: 8px;
    gap: 5px;
  }

  .lab2-panel {
    padding: 7px;
    gap: 4px;
    border-radius: 13px;
  }

  .lab2-panel button,
  .lab2-panel a {
    padding: 7px 9px;
    font-size: 11px;
  }

  .lab2-sidebar {
    top: auto;
    bottom: 8px;
    right: 8px;
    left: auto;
    width: min(300px, 82vw);
    height: 48vh;
    max-height: 48vh;
    padding: 13px;
  }

  .lab2-sidebar h2 {
    font-size: 17px;
  }

  .lab2-bottom {
    bottom: 8px;
    left: 8px;
    gap: 4px;
  }

  .lab2-bottom button {
    padding: 9px;
    font-size: 11px;
  }
}
</style>
</head>

<body>

<header class="lab2-header">

  <div class="lab2-panel">
    ⚗️
    <strong>문산중학교 3D 과학실 안내</strong>
    <a href="../index.html">메인</a>
  </div>

  <div class="lab2-panel">
    <a href="../science1/index.html">과학실 1</a>
    <button class="active">과학실 2</button>
    <a href="../science3/index.html">과학실 3</a>
  </div>

  <div class="lab2-panel">
    <button data-view="overview" class="active">
      전체보기
    </button>
    <button data-view="left">왼쪽</button>
    <button data-view="back">뒤쪽</button>
    <button data-view="window">창가</button>
    <button data-view="top">위에서</button>
  </div>

</header>

<aside class="lab2-sidebar">

  <h2>과학실 2</h2>

  <p class="lab2-subtitle">
    물리 · 화학 중심 실험실
  </p>

  <!-- 검색 목록 화면 -->
  <div id="searchArea" class="lab2-search-area">

    <input
      id="search"
      type="search"
      placeholder="보관장 · 기자재 검색"
    >

    <div id="results"></div>

  </div>

  <!-- 보관장 상세정보 화면 -->
  <section id="detail" hidden>

    <div class="lab2-detail-heading">
      <h3 id="detailTitle"></h3>
      <button id="detailClose">닫기</button>
    </div>

    <p id="detailMeta"></p>

    <div id="shelfList"></div>

    <button id="doorToggle">
      보관장 문 열기
    </button>

  </section>

</aside>

<div class="lab2-bottom">
  <button id="reset">초기화</button>
  <button id="fullscreen">전체화면</button>
  <button id="theme">🌙 야간 모드</button>
</div>

<div id="notice"></div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- 과학실 2 배치 -->
<script src="./layout.js"></script>

<!-- 공통 3D 엔진 -->
<script src="../common/scene.js"></script>

<!-- 검색 목록 / 상세정보 화면 전환 -->
<script>
(function () {
  const searchArea =
    document.getElementById('searchArea');

  const detail =
    document.getElementById('detail');

  const results =
    document.getElementById('results');

  const close =
    document.getElementById('detailClose');

  // 검색 결과 또는 3D 보관장을 클릭해
  // 상세정보가 열리면 검색 목록 숨기기

  const observer = new MutationObserver(() => {
    if (!detail.hidden) {
      searchArea.hidden = true;
    } else {
      searchArea.hidden = false;
    }
  });

  observer.observe(detail, {
    attributes: true,
    attributeFilter: ['hidden']
  });

  // 검색 결과를 선택하면 상세정보가 열림
  // 상세정보 상태를 확인해 목록 전환

  results.addEventListener('click', () => {
    requestAnimationFrame(() => {
      if (!detail.hidden) {
        searchArea.hidden = true;
      }
    });
  });

  // 닫기 버튼을 누르면 검색 목록 복귀

  close.addEventListener('click', () => {
    requestAnimationFrame(() => {
      searchArea.hidden = false;
    });
  });

})();
</script>

</body>
</html>
