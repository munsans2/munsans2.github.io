
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문산중학교 | 과학실 2</title>

<link rel="stylesheet" href="../common/style.css">

<style>
body {
  margin: 0;
  font-family: "Pretendard", "Malgun Gothic", sans-serif;
}

.lab2-header {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 20;
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.lab2-panel {
  background: rgba(255,255,255,.92);
  border: 1px solid rgba(210,225,240,.8);
  border-radius: 20px;
  padding: 12px 16px;
  box-shadow: 0 8px 28px rgba(45,80,120,.12);
  backdrop-filter: blur(18px);
}

.lab2-panel button,
.lab2-panel a {
  border: 0;
  border-radius: 12px;
  padding: 9px 12px;
  background: #edf4fa;
  color: #344b65;
  cursor: pointer;
  text-decoration: none;
  font-size: 13px;
}

.lab2-panel button.active {
  background: #2878e8;
  color: white;
}

.lab2-sidebar {
  position: fixed;
  top: 110px;
  right: 18px;
  bottom: 20px;
  width: 300px;
  z-index: 20;
  overflow: auto;
  padding: 20px;
  background: rgba(255,255,255,.93);
  border: 1px solid #dbe5ef;
  border-radius: 22px;
  box-shadow: 0 12px 35px rgba(40,70,110,.12);
  backdrop-filter: blur(18px);
}

.lab2-sidebar h2 {
  margin: 0 0 14px;
}

.lab2-sidebar input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccdbe9;
  border-radius: 12px;
  box-sizing: border-box;
}

.lab2-sidebar button {
  cursor: pointer;
  border: 0;
  padding: 10px 12px;
  border-radius: 10px;
  background: #edf4fa;
  color: #344b65;
}

#results button,
#shelfList button {
  display: block;
  width: 100%;
  margin-top: 7px;
  text-align: left;
}

#results small {
  display: block;
  color: #71859a;
  margin-top: 3px;
}

#detail {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid #e0e9f1;
}

#detail[hidden] {
  display: none;
}

#detailMeta {
  font-size: 13px;
  line-height: 1.7;
  color: #64778c;
}

#notice {
  display: none;
  position: fixed;
  z-index: 100;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  background: white;
  padding: 24px;
  border-radius: 16px;
}

.lab2-bottom {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 20;
  display: flex;
  gap: 8px;
}

.lab2-bottom button {
  background: rgba(255,255,255,.92);
  border: 1px solid #d8e4ef;
  padding: 12px;
  border-radius: 12px;
  cursor: pointer;
}

body.dark .lab2-panel,
body.dark .lab2-sidebar {
  background: rgba(28,41,59,.94);
  color: #e8f1fb;
}

@media(max-width: 700px) {
  .lab2-header {
    top: 8px;
    left: 8px;
    right: 8px;
  }
  .lab2-sidebar {
    top: auto;
    bottom: 8px;
    right: 8px;
    width: min(280px, 75vw);
    max-height: 48vh;
  }
}
</style>
</head>

<body>

<header class="lab2-header">
  <div class="lab2-panel">
    ⚗️ <strong>문산중학교 3D 과학실 안내</strong>
    <a href="../index.html">메인</a>
  </div>

  <div class="lab2-panel">
    <a href="../science1/index.html">과학실 1</a>
    <button class="active">과학실 2</button>
    <a href="../science3/index.html">과학실 3</a>
  </div>

  <div class="lab2-panel">
    <button data-view="overview" class="active">전체보기</button>
    <button data-view="left">왼쪽</button>
    <button data-view="back">뒤쪽</button>
    <button data-view="window">창가</button>
    <button data-view="top">위에서</button>
  </div>
</header>

<aside class="lab2-sidebar">
  <h2>과학실 2</h2>
  <p style="font-size:13px;color:#71859a">
    물리 · 화학 중심 실험실
  </p>

  <input
    id="search"
    type="search"
    placeholder="보관장 · 기자재 검색"
  >

  <div id="results"></div>

  <section id="detail" hidden>
    <button id="detailClose" style="float:right">닫기</button>
    <h3 id="detailTitle"></h3>
    <p id="detailMeta"></p>
    <div id="shelfList"></div>
    <button id="doorToggle" style="margin-top:12px">
      보관장 문 열기
    </button>
  </section>
</aside>

<div class="lab2-bottom">
  <button id="reset">초기화</button>
  <button id="fullscreen">전체화면</button>
  <button id="theme">🌙 야간 모드</button>
</div>

<div id="notice"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<!-- 과학실 2 배치 -->
<script src="./layout.js"></script>

<!-- 과학실 1과 동일한 공통 3D 엔진 -->
<script src="../common/scene.js"></script>

</body>
</html>
